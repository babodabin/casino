<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />

    <!-- 홈 화면에 추가해서 열었을 때(전체화면) 맨 위 상태바 영역 설정입니다. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="World Casino" />
    <meta name="theme-color" content="#150E16" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./icon.png" />
    <title>World Casino</title>

    <!--
      글씨체. 이 앱은 사실상 웹으로만 도니까 구글 폰트를 받아 씁니다.
      Cinzel은 로마 비문 세리프라 카지노 간판 느낌이고(로마자 전용),
      Noto Sans KR은 한글과 숫자를 받습니다.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;900&family=Noto+Sans+KR:wght@400;700;900&display=swap"
      rel="stylesheet"
    />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /*
         iOS 홈 화면 앱의 layout viewport 아래쪽은 DOM 바깥 캔버스가 보일 수 있습니다.
         해결된 야구 앱과 같은 방식으로 그 바깥 캔버스를 하단 내비게이션 색으로 맞춥니다.
         ⚠️ 이 값은 App.tsx의 tabBar 배경색과 **같아야** 합니다. 다르면 아래에 띠가 보입니다.
      */
      html,
      body {
        background-color: #1B1019;
      }
      /*
         글씨체를 여기서 겁니다.
         ⚠️ body에만 걸면 안 먹습니다 — react-native-web이 글자마다 기본 글꼴을
         직접 박아 넣기 때문입니다. #root를 낀 선택자라야 그것을 이깁니다.
      */
      html body #root * {
        font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      /*
         제목용 세리프. App.tsx에서 dataSet={{ display: 'y' }}를 준 글자만 이 글꼴이 됩니다.
         한글이 없는 글꼴이라 로마자 제목에만 쓰세요.
      */
      html body #root [data-display] {
        font-family: 'Cinzel', 'Times New Roman', serif;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
</body>
</html>
