name: Deploy app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Keep top safe area in header only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('App.tsx')
          text = path.read_text()

          root_old = '<View style={[styles.app, { paddingTop: insets.top }]}>'
          root_new = '<View style={styles.app}>'
          header_old = '<Header coins={coins} totalPlays={totalPlays} />'
          header_new = '''<View style={{ paddingTop: insets.top }}>
        <Header coins={coins} totalPlays={totalPlays} />
      </View>'''

          if text.count(root_old) != 1:
              raise SystemExit(f'Expected one main root marker, found {text.count(root_old)}')
          if text.count(header_old) != 1:
              raise SystemExit(f'Expected one Header marker, found {text.count(header_old)}')

          text = text.replace(root_old, root_new, 1)
          text = text.replace(header_old, header_new, 1)
          path.write_text(text)
          PY

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm exec expo export --platform web --output-dir dist

      - name: Make project-page asset paths relative
        shell: bash
        run: |
          # 속성 이름을 가리지 않고 절대 경로를 전부 상대 경로로 바꿉니다
          sed -i 's|="/_expo/|="./_expo/|g' dist/index.html
          sed -i 's|="/assets/|="./assets/|g' dist/index.html
          touch dist/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload web app
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy web app
        id: deployment
        uses: actions/deploy-pages@v4
