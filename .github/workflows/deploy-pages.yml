name: Deploy app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm exec expo export --platform web --output-dir dist

      - name: Prepare GitHub Pages output
        shell: bash
        run: |
          # 속성 이름을 가리지 않고 절대 경로를 전부 상대 경로로 바꿉니다
          sed -i 's|="/_expo/|="./_expo/|g' dist/index.html
          sed -i 's|="/assets/|="./assets/|g' dist/index.html

          # iPhone 홈 화면 아이콘은 빌드 결과물에 직접 넣고 새 파일명으로 연결합니다.
          cp assets/icon.png dist/world-casino-icon-v2.png
          sed -i '/apple-touch-icon/d' dist/index.html
          sed -i 's|</head>|  <link rel="apple-touch-icon" sizes="180x180" href="./world-casino-icon-v2.png?v=2" />\n</head>|' dist/index.html

          touch dist/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload web app
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy web app
        id: deployment
        uses: actions/deploy-pages@v4
