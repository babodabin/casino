name: Deploy app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm exec expo export --platform web --output-dir dist

      - name: Prepare GitHub Pages output
        shell: bash
        run: |
          sed -i 's|="/_expo/|="./_expo/|g' dist/index.html
          sed -i 's|="/assets/|="./assets/|g' dist/index.html

          # 홈 화면 아이콘만 교체하고, 같은 줄의 viewport/theme/style 등은 절대 지우지 않습니다.
          cp assets/icon.png dist/icon.png
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('dist/index.html')
          html = path.read_text()
          icon = '<link rel="apple-touch-icon" href="./icon.png?v=5" />'
          pattern = r'<link[^>]+rel=["\']apple-touch-icon["\'][^>]*>'

          if re.search(pattern, html, flags=re.IGNORECASE):
              html = re.sub(pattern, icon, html, count=1, flags=re.IGNORECASE)
          else:
              html = html.replace('</head>', f'{icon}\n</head>')

          path.write_text(html)
          PY

          touch dist/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload web app
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy web app
        id: deployment
        uses: actions/deploy-pages@v4
