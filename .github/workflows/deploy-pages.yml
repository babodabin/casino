name: Deploy app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lock bottom tab bar layout
        shell: bash
        run: |
          # 하단 메뉴 자체는 72px로 유지합니다.
          # iPhone의 하단 안전영역은 index.html의 전체화면 viewport가 담당합니다.
          python - <<'PY'
          from pathlib import Path

          path = Path('App.tsx')
          text = path.read_text()
          dynamic = "style={[styles.tabBar, { height: 72 + insets.bottom, paddingBottom: insets.bottom }]}"
          fixed = "style={styles.tabBar}"

          if dynamic in text:
              text = text.replace(dynamic, fixed, 1)
              path.write_text(text)
          elif fixed not in text:
              raise SystemExit('Bottom tab bar layout marker not found; refusing to deploy a possibly shifted tab bar.')
          PY

      - name: Build web app
        run: pnpm exec expo export --platform web --output-dir dist

      - name: Prepare GitHub Pages output
        shell: bash
        run: |
          sed -i 's|="/_expo/|="./_expo/|g' dist/index.html
          sed -i 's|="/assets/|="./assets/|g' dist/index.html

          cp assets/icon.png dist/icon.png
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('dist/index.html')
          html = path.read_text()

          # iPhone이 홈 인디케이터 아래까지 앱의 실제 viewport로 잡도록
          # JS가 실행되기 전 HTML 단계에서 viewport-fit=cover를 강제합니다.
          viewport_re = re.compile(r'<meta[^>]+name=["\']viewport["\'][^>]*>', re.IGNORECASE)
          match = viewport_re.search(html)
          if match:
              tag = match.group(0)
              content_match = re.search(r'content=["\']([^"\']*)["\']', tag, re.IGNORECASE)
              content = content_match.group(1) if content_match else 'width=device-width, initial-scale=1'
              if 'viewport-fit=cover' not in content:
                  content = content.rstrip(' ,') + ', viewport-fit=cover'
              replacement = f'<meta name="viewport" content="{content}" />'
              html = html[:match.start()] + replacement + html[match.end():]
          else:
              html = html.replace('<head>', '<head>\n<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />', 1)

          # 홈 화면 전체화면 모드도 빌드 결과에 항상 남겨 둡니다.
          if 'apple-mobile-web-app-capable' not in html:
              html = html.replace('</head>', '<meta name="apple-mobile-web-app-capable" content="yes" />\n</head>', 1)
          if 'apple-mobile-web-app-status-bar-style' not in html:
              html = html.replace('</head>', '<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />\n</head>', 1)

          # Expo의 100% 높이가 iOS에서 safe-area 위에서 끝나는 경우를 막고
          # 실제 화면 높이(dvh)를 root까지 사용하게 합니다.
          full_height_style = '''<style id="world-casino-fullscreen-fix">
html, body, #root {
  width: 100%;
  height: 100dvh !important;
  min-height: 100dvh !important;
  margin: 0;
  padding: 0;
  background: #080B12;
}
body { overflow: hidden; }
</style>'''
          if 'world-casino-fullscreen-fix' not in html:
              html = html.replace('</head>', full_height_style + '\n</head>', 1)

          icon = '<link rel="apple-touch-icon" href="./icon.png?v=6" />'
          icon_re = r'<link[^>]+rel=["\']apple-touch-icon["\'][^>]*>'
          if re.search(icon_re, html, flags=re.IGNORECASE):
              html = re.sub(icon_re, icon, html, count=1, flags=re.IGNORECASE)
          else:
              html = html.replace('</head>', f'{icon}\n</head>', 1)

          path.write_text(html)
          PY

          touch dist/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload web app
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy web app
        id: deployment
        uses: actions/deploy-pages@v4
