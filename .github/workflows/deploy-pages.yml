name: Deploy app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lock bottom tab bar layout
        shell: bash
        run: |
          # iPhone의 safe-area 값이 달라져도 하단 메뉴는 항상 원래 72px 위치를 유지합니다.
          # 예전 App.tsx가 다시 올라와도 배포 전에 자동으로 고치며,
          # 예상한 코드가 없으면 잘못된 화면을 배포하지 않고 여기서 중단합니다.
          python - <<'PY'
          from pathlib import Path

          path = Path('App.tsx')
          text = path.read_text()
          dynamic = "style={[styles.tabBar, { height: 72 + insets.bottom, paddingBottom: insets.bottom }]}"
          fixed = "style={styles.tabBar}"

          if dynamic in text:
              text = text.replace(dynamic, fixed, 1)
              path.write_text(text)
          elif fixed not in text:
              raise SystemExit('Bottom tab bar layout marker not found; refusing to deploy a possibly shifted tab bar.')
          PY

      - name: Build web app
        run: pnpm exec expo export --platform web --output-dir dist

      - name: Prepare GitHub Pages output
        shell: bash
        run: |
          sed -i 's|="/_expo/|="./_expo/|g' dist/index.html
          sed -i 's|="/assets/|="./assets/|g' dist/index.html

          # 홈 화면 아이콘만 교체하고, 같은 줄의 viewport/theme/style 등은 절대 지우지 않습니다.
          cp assets/icon.png dist/icon.png
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('dist/index.html')
          html = path.read_text()
          icon = '<link rel="apple-touch-icon" href="./icon.png?v=5" />'
          pattern = r'<link[^>]+rel=["\']apple-touch-icon["\'][^>]*>'

          if re.search(pattern, html, flags=re.IGNORECASE):
              html = re.sub(pattern, icon, html, count=1, flags=re.IGNORECASE)
          else:
              html = html.replace('</head>', f'{icon}\n</head>')

          path.write_text(html)
          PY

          touch dist/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload web app
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy web app
        id: deployment
        uses: actions/deploy-pages@v4
