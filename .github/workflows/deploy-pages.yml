name: Deploy app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply verified safe-area fix to source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('App.tsx')
          text = path.read_text()

          # 검증된 해결책 그대로:
          # 1) 루트 SafeAreaView 제거
          # 2) 탭바의 insets.bottom은 그대로 한 번만 유지
          text = text.replace('  SafeAreaView,\n', '')
          text = text.replace(
              '<SafeAreaView style={styles.splash}>',
              '<View style={[styles.splash, { paddingTop: insets.top }]}>',
          )
          text = text.replace('</SafeAreaView>', '</View>')

          required = [
              '<View style={[styles.app, { paddingTop: insets.top }]}>' ,
              'style={[styles.tabBar, { height: 72 + insets.bottom, paddingBottom: insets.bottom }]}',
          ]
          if '<SafeAreaView' in text or '</SafeAreaView>' in text or '  SafeAreaView,\n' in text:
              raise SystemExit('SafeAreaView component still remains; refusing to deploy.')
          if not all(marker in text for marker in required):
              raise SystemExit('Verified safe-area layout markers not found; refusing to deploy.')

          path.write_text(text)
          PY

          if ! git diff --quiet -- App.tsx; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add App.tsx
            git commit -m "Remove duplicate root safe-area padding"
            git push origin HEAD:main
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm exec expo export --platform web --output-dir dist

      - name: Prepare GitHub Pages output
        shell: bash
        run: |
          sed -i 's|="/_expo/|="./_expo/|g' dist/index.html
          sed -i 's|="/assets/|="./assets/|g' dist/index.html

          # 아이콘만 교체합니다. safe-area/레이아웃은 여기서 건드리지 않습니다.
          cp assets/icon.png dist/icon.png
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('dist/index.html')
          html = path.read_text()
          icon = '<link rel="apple-touch-icon" href="./icon.png?v=5" />'
          pattern = r'<link[^>]+rel=["\']apple-touch-icon["\'][^>]*>'

          if re.search(pattern, html, flags=re.IGNORECASE):
              html = re.sub(pattern, icon, html, count=1, flags=re.IGNORECASE)
          else:
              html = html.replace('</head>', f'{icon}\n</head>')

          path.write_text(html)
          PY

          touch dist/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload web app
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy web app
        id: deployment
        uses: actions/deploy-pages@v4
