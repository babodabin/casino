name: Deploy app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm exec expo export --platform web --output-dir dist

      - name: Prepare GitHub Pages output
        shell: bash
        run: |
          sed -i 's|="/_expo/|="./_expo/|g' dist/index.html
          sed -i 's|="/assets/|="./assets/|g' dist/index.html

          cp assets/icon.png dist/icon.png
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('dist/index.html')
          html = path.read_text()

          # Keep edge-to-edge viewport support, but do not use black-translucent.
          viewport_re = re.compile(r'<meta[^>]+name=["\']viewport["\'][^>]*>', re.IGNORECASE)
          match = viewport_re.search(html)
          if match:
              tag = match.group(0)
              content_match = re.search(r'content=["\']([^"\']*)["\']', tag, re.IGNORECASE)
              content = content_match.group(1) if content_match else 'width=device-width, initial-scale=1'
              if 'viewport-fit=cover' not in content:
                  content = content.rstrip(' ,') + ', viewport-fit=cover'
              replacement = f'<meta name="viewport" content="{content}" />'
              html = html[:match.start()] + replacement + html[match.end():]
          else:
              html = html.replace('<head>', '<head>\n<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />', 1)

          if 'apple-mobile-web-app-capable' not in html:
              html = html.replace('</head>', '<meta name="apple-mobile-web-app-capable" content="yes" />\n</head>', 1)

          # iOS 26 standalone PWA can create a bottom chin gap when this is combined
          # with viewport-fit=cover, so remove it from every deployment.
          html = re.sub(
              r'<meta[^>]+name=["\']apple-mobile-web-app-status-bar-style["\'][^>]*>\s*',
              '',
              html,
              flags=re.IGNORECASE,
          )

          # Remove the temporary fullscreen workaround if it ever appears.
          html = re.sub(
              r'<style[^>]+id=["\']world-casino-fullscreen-fix["\'][^>]*>.*?</style>\s*',
              '',
              html,
              flags=re.IGNORECASE | re.DOTALL,
          )

          icon = '<link rel="apple-touch-icon" href="./icon.png?v=7" />'
          icon_re = r'<link[^>]+rel=["\']apple-touch-icon["\'][^>]*>'
          if re.search(icon_re, html, flags=re.IGNORECASE):
              html = re.sub(icon_re, icon, html, count=1, flags=re.IGNORECASE)
          else:
              html = html.replace('</head>', f'{icon}\n</head>', 1)

          path.write_text(html)
          PY

          touch dist/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload web app
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy web app
        id: deployment
        uses: actions/deploy-pages@v4
