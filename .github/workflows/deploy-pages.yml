name: Deploy app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        # 설정 화면 맨 아래에 이 값이 찍힙니다. 폰이 옛 화면을 들고 있는지 이걸로 봅니다.
        run: |
          export EXPO_PUBLIC_BUILD="$(TZ=Asia/Seoul date '+%m-%d %H:%M') $(echo "$GITHUB_SHA" | cut -c1-7)"
          pnpm exec expo export --platform web --output-dir dist

      - name: Make project-page asset paths relative
        shell: bash
        run: |
          # 속성 이름을 가리지 않고 절대 경로를 전부 상대 경로로 바꿉니다
          sed -i 's|="/_expo/|="./_expo/|g' dist/index.html
          sed -i 's|="/assets/|="./assets/|g' dist/index.html
          # Expo의 JS 번들 안에 기록된 정적 이미지 경로도 프로젝트 페이지 기준으로 바꿉니다.
          # 이 처리가 없으면 /casino/assets가 아닌 도메인 루트 /assets를 찾아 카드가 빈칸으로 보입니다.
          find dist/_expo -type f -name '*.js' -exec sed -i 's|uri:"/assets/|uri:"/casino/assets/|g' {} +
          touch dist/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload web app
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy web app
        id: deployment
        uses: actions/deploy-pages@v4
