name: Deploy app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply measured iPhone standalone inset fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('App.tsx')
          text = path.read_text()

          old = '''      let top = parseFloat(style.paddingTop) || 0;
      const bottom = parseFloat(style.paddingBottom) || 0;
      probe.remove();
      // 전체화면인데 값을 못 읽으면 헤더가 시계와 겹칩니다. 그럴 때만 최소값을 둡니다.
      if (standalone && top === 0) top = 44;
      const next = { top, bottom };'''

          new = '''      let top = parseFloat(style.paddingTop) || 0;
      const bottom = parseFloat(style.paddingBottom) || 0;
      probe.remove();
      // iOS 홈 화면 실행에서는 실제 layout viewport가 이미 상단 safe-area를 제외합니다.
      // 실측: screen 956, inner/root 894, safe-area top 62. 따라서 top을 다시 더하면 62px가 중복됩니다.
      // 하단 safe-area는 viewport에서 빠지지 않으므로 bottom 값은 그대로 유지합니다.
      if (standalone) top = 0;
      const next = { top, bottom };'''

          if text.count(old) != 1:
              raise SystemExit(f'Expected one safe-area measurement block, found {text.count(old)}')

          path.write_text(text.replace(old, new, 1))
          PY

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm exec expo export --platform web --output-dir dist

      - name: Make project-page asset paths relative
        shell: bash
        run: |
          # 속성 이름을 가리지 않고 절대 경로를 전부 상대 경로로 바꿉니다
          sed -i 's|="/_expo/|="./_expo/|g' dist/index.html
          sed -i 's|="/assets/|="./assets/|g' dist/index.html
          touch dist/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload web app
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy web app
        id: deployment
        uses: actions/deploy-pages@v4
